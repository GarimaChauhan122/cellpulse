replicaCount: 2
image:
  repository: registry.example.com/team/cellpulse
  tag: dev
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8080
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 128Mi }
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
