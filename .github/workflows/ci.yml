# CellPulse pipeline (GitHub Actions)
#   PR / push:  lint + test + security scans -> build & scan image -> deploy to ephemeral kind cluster + smoke test
#   main only:  manual approval (environment "production") -> publish image to GHCR
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# least privilege by default; individual jobs ask for more
permissions:
  contents: read

# a newer push to the same branch/PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: cellpulse
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------- verify ----------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest   # coverage gate (85%) + junit/coverage xml are configured in pyproject.toml
      - name: Coverage summary
        if: always()
        run: |
          echo "### Tests (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          python -c "import xml.etree.ElementTree as E;r=E.parse('coverage.xml').getroot();print('Line coverage: %.1f%%' % (float(r.get('line-rate'))*100))" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/cellpulse
      - run: helm template t helm/cellpulse > /dev/null

  # ---------------- security (shift-left) ----------------
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # scan full history, not just the last commit
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit==1.8.0
      - run: bandit -r app -ll

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.7.3
      - run: pip-audit -r requirements.txt

  # ---------------- build + scan the artifact ----------------
  build:
    needs: [lint, test, helm-lint, secret-scan, sast-bandit, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Save image so later jobs deploy exactly this build
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # ---------------- deploy to an ephemeral Kubernetes cluster ----------------
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image }
      - uses: helm/kind-action@v1          # throwaway kind cluster inside the runner
        with: { cluster_name: staging }
      - name: Load the exact image built earlier into the cluster
        run: |
          gunzip -c image.tar.gz | docker load
          kind load docker-image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --name staging
      - name: Helm deploy (atomic = auto-rollback on failure)
        run: |
          helm upgrade --install cellpulse helm/cellpulse \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set image.pullPolicy=Never \
            --set replicaCount=2 \
            --atomic --timeout 120s
      - name: Smoke test (also verifies the running commit)
        run: |
          kubectl port-forward svc/cellpulse 8080:80 &
          sleep 3
          python3 scripts/smoke_test.py http://localhost:8080 ${{ github.sha }}
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deployment cellpulse
          kubectl logs -l app=cellpulse --tail=100 || true

  # ---------------- release (main only, needs human approval) ----------------
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production        # configure "required reviewers" on this environment in repo settings
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      - name: Push the already-tested image to GHCR
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          gunzip -c image.tar.gz | docker load
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} "$REPO:${{ env.IMAGE_TAG }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} "$REPO:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$REPO:${{ env.IMAGE_TAG }}"
          docker push "$REPO:latest"
          echo "Published $REPO:${{ env.IMAGE_TAG }}" >> "$GITHUB_STEP_SUMMARY"
